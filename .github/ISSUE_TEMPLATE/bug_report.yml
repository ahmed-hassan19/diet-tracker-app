name: Bug report
description: Report a reproducible application problem
body:
  - type: textarea
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    attributes:
      label: Browser and device
  - type: textarea
    attributes:
      label: Console output
      description: Remove personal or health data before pasting.
