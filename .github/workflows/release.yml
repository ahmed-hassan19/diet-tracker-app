name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.base_ref == null
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Require annotated tag
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = tag
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npx firebase emulators:exec --project diet-tracker-372ca --only auth,firestore,hosting "npm run test:browser"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - run: npx firebase deploy --only hosting:main,hosting:nice --project diet-tracker-372ca --non-interactive
      - name: Verify production source
        run: |
          # the CDN can still serve the previous revision for a few seconds after
          # deploy returns, so a first-attempt mismatch is not yet a failed release
          check() {
            for _ in 1 2 3 4 5; do
              if curl --fail --silent --show-error "$1" -o live.out && cmp "$2" live.out; then
                return 0
              fi
              sleep 15
            done
            echo "::error::$1 still does not match $2 after 5 attempts"
            return 1
          }
          # the catch-all rewrite serves index.html (HTTP 200) for a missing .js,
          # so every file has to be compared, not just the entry point
          for host in https://diet-tracker-372ca.web.app https://5asesny.web.app; do
            for file in $(cd public && find . -type f -not -name '.*' | sed 's|^\./||'); do
              path="$file"
              test "$file" = index.html && path=""
              check "$host/$path" "public/$file"
            done
          done

  publish:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          title="Diet Tracker $TAG"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest --title "$title"
            exit 0
          fi

          previous_args=()
          if previous_tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null)"; then
            previous_args=(--notes-start-tag "$previous_tag")
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "$title" --generate-notes "${previous_args[@]}"
