name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Annotated tag that was deployed (e.g. v3.6.0)"
        required: true
      commit:
        description: "Release commit SHA the tag points to"
        required: true
      validation_run_id:
        description: "Successful tag validation run ID from the deployment manifest"
        required: true
      bundle_sha256:
        description: "bundle_sha256 from the local deployment manifest"
        required: true
      ruleset_sha256:
        description: "ruleset_sha256 from the local deployment manifest"
        required: true
      indexes_sha256:
        description: "indexes_sha256 from the local deployment manifest"
        required: true
      verification_sha256:
        description: "Hash of the local release verification record"
        required: true
      deployed_at:
        description: "ISO timestamp of the verified production deployment"
        required: true
      post_deploy_verified_at:
        description: "ISO timestamp of the repeated Spark/config check"
        required: true

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  # Runs on the tag push with zero cloud credentials: provenance, checks, and
  # an immutable checksum record of the tagged public/ bundle.
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Require annotated tag on the reviewed origin/main commit
        run: |
          git fetch --force origin main
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = tag || {
            echo "::error::${GITHUB_REF_NAME} is not an annotated tag"; exit 1; }
          peeled="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          test "$peeled" = "$(git rev-parse origin/main)" || {
            echo "::error::tag commit $peeled is not origin/main $(git rev-parse origin/main)"; exit 1; }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: node scripts/version-contract.mjs --tag "$GITHUB_REF_NAME"
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npx firebase emulators:exec --project diet-tracker-372ca --only auth,firestore,hosting "npm run test:browser"
      - name: Record tagged bundle, Rules, and index checksums
        run: |
          node scripts/release-hashes.mjs > tagged-hashes.json
          node scripts/release-hashes.mjs --bundle-list > bundle.txt
          cat tagged-hashes.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bundle-checksums-${{ github.ref_name }}
          path: |
            bundle.txt
            tagged-hashes.json
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Triggered by hand after scripts/release-deploy.mjs has deployed and verified
  # production from the exact tag using human Firebase OAuth. This job holds no
  # Google/Firebase credential — only the scoped GitHub token — and re-verifies
  # provenance plus every public live byte before publishing the Release.
  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify tag provenance matches the deployment record
        env:
          TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::invalid release tag $TAG"; exit 1; }
          git fetch --force origin main
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          test "$(git cat-file -t "refs/tags/${TAG}")" = tag || {
            echo "::error::${TAG} is not an annotated tag"; exit 1; }
          peeled="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          test "$peeled" = "$EXPECTED_COMMIT" || {
            echo "::error::tag peels to $peeled, deployment record says $EXPECTED_COMMIT"; exit 1; }
          git merge-base --is-ancestor "$peeled" origin/main || {
            echo "::error::$peeled is not on origin/main"; exit 1; }
      - name: Require successful validation for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ inputs.commit }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
        run: |
          validation="$(gh run view "$VALIDATION_RUN_ID" --json workflowName,headBranch,headSha,event,status,conclusion)"
          test "$(jq -r .workflowName <<<"$validation")" = release &&
          test "$(jq -r .headBranch <<<"$validation")" = "$TAG" &&
          test "$(jq -r .headSha <<<"$validation")" = "$EXPECTED_COMMIT" &&
          test "$(jq -r .event <<<"$validation")" = push &&
          test "$(jq -r .status <<<"$validation")" = completed &&
          test "$(jq -r .conclusion <<<"$validation")" = success || {
            echo "::error::run $VALIDATION_RUN_ID is not successful validation for $TAG/$EXPECTED_COMMIT"; exit 1; }
      - name: Compare tagged bundle, Rules, and indexes with the deployment record
        env:
          EXPECTED_BUNDLE: ${{ inputs.bundle_sha256 }}
          EXPECTED_RULESET: ${{ inputs.ruleset_sha256 }}
          EXPECTED_INDEXES: ${{ inputs.indexes_sha256 }}
        run: |
          node scripts/release-hashes.mjs --verify
      - name: Verify every public live byte on both hosts
        run: |
          check() {
            for _ in 1 2 3 4 5; do
              if curl --fail --silent --show-error "$1" -o live.out && cmp "$2" live.out; then
                return 0
              fi
              sleep 15
            done
            echo "::error::$1 still does not match $2 after 5 attempts"
            return 1
          }
          # the catch-all rewrite serves index.html (HTTP 200) for a missing .js,
          # so every file has to be compared, not just the entry point
          for host in https://diet-tracker-372ca.web.app https://5asesny.web.app; do
            while IFS= read -r -d '' file; do
              file="${file#public/}"
              path="$file"
              test "$file" = index.html && path=""
              check "$host/$path" "public/$file"
            done < <(node scripts/release-hashes.mjs --file-list0)
          done
      - name: Publish GitHub Release with the deployment summary
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
          BUNDLE: ${{ inputs.bundle_sha256 }}
          RULESET: ${{ inputs.ruleset_sha256 }}
          INDEXES: ${{ inputs.indexes_sha256 }}
          VERIFICATION: ${{ inputs.verification_sha256 }}
          DEPLOYED_AT: ${{ inputs.deployed_at }}
          POST_DEPLOY_VERIFIED_AT: ${{ inputs.post_deploy_verified_at }}
        run: |
          [[ "$DEPLOYED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]] || {
            echo "::error::invalid deployed_at"; exit 1; }
          [[ "$POST_DEPLOY_VERIFIED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]] || {
            echo "::error::invalid post_deploy_verified_at"; exit 1; }
          [[ "$VERIFICATION" =~ ^[a-f0-9]{64}$ ]] || {
            echo "::error::invalid verification_sha256"; exit 1; }
          title="Diet Tracker $TAG"
          rules_short="${RULESET:0:12}"
          indexes_short="${INDEXES:0:12}"
          bundle_short="${BUNDLE:0:12}"
          verification_short="${VERIFICATION:0:12}"
          notes="Verified production deployment from ${COMMIT} at ${DEPLOYED_AT}.
          Deployed and byte-verified locally from the exact annotated tag with
          human Firebase OAuth (\`scripts/release-deploy.mjs\`); Firestore Rules
          source sha256 \`${rules_short}…\`; index specification sha256
          \`${indexes_short}…\`; tagged bundle sha256 \`${bundle_short}…\`.
          Release verification sha256 \`${verification_short}…\`; Spark/no-billing
          and configuration were rechecked at ${POST_DEPLOY_VERIFIED_AT}."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest \
              --title "$title" --notes "$notes"
            exit 0
          fi
          previous_args=()
          if previous_tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null)"; then
            previous_args=(--notes-start-tag "$previous_tag")
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "$title" --notes "$notes" "${previous_args[@]}"
